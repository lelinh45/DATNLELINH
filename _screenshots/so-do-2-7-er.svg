  <text x="40" y="1316">Chú thích: <tspan font-weight="bold" text-decoration="underline">gạch chân</tspan> = khóa chính · <tspan font-weight="bold">chữ đậm</tspan> = trường tham chiếu (quan hệ logic — MongoDB không có khóa ngoại vật lý) · (UK) = unique</text>
  <text x="40" y="1336">Mũi tên 1→n đọc "một bản ghi cha có n bản ghi con" · nét đứt = document nhúng trong bảng cha (files[] nằm trong batches)</text>
